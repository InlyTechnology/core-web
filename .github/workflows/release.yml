name: Release

# Runs from the Actions tab (also in the GitHub mobile app): heads the
# changelog's "## Unreleased" section with the new version, commits that to
# main, tags that commit and publishes the release with the section as notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, or an exact version like 0.19.0'
        required: true
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from main."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require green tests on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release commit is pushed with the workflow token, which starts no
          # Tests run, so a release straight after one checks the commit before it.
          sha="$(git rev-parse HEAD)"
          if [[ "$(git log -1 --format=%s HEAD)" == "Release v"* && "$(git diff --name-only HEAD^ HEAD)" == "CHANGELOG.md" ]]; then
            sha="$(git rev-parse HEAD^)"
          fi
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | startswith("PHP "))]')"
          if [[ "$(jq length <<< "$runs")" == 0 ]] || jq -e 'any(.[]; .conclusion != "success")' <<< "$runs" > /dev/null; then
            echo "::error::The Tests workflow has not passed on $sha."
            jq -r '.[] | "\(.name): \(.status) \(.conclusion // "")"' <<< "$runs"
            exit 1
          fi

      - name: Head the changelog
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="$(.github/scripts/release.sh "$VERSION" "$RUNNER_TEMP/notes.md")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release $TAG"
          git tag "$TAG"
          # Atomic, so main and the tag land together or not at all; a main
          # that moved since checkout is refused rather than overwritten.
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
