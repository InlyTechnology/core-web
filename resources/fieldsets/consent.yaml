title: 'Cookie banner'
fields:
  -
    handle: consent_title
    field:
      type: text
      display: 'Cookie banner title'
      instructions: 'Leave empty for the default title.'
  -
    handle: consent_text
    field:
      type: textarea
      display: 'Cookie banner text'
      instructions: 'Leave empty for the default text.'
  -
    handle: consent_policy_page
    field:
      type: entries
      max_items: 1
      mode: default
      display: 'Cookie page'
      instructions: 'The page the banner links to for more about cookies.'
