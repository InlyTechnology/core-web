title: 'Cookie banner'
fields:
  -
    handle: consent_title
    field:
      type: text
      display: 'Cookie banner title'
      instructions: 'Leave empty for the default title.'
  -
    handle: consent_text
    field:
      type: textarea
      display: 'Cookie banner text'
      instructions: 'Leave empty for the default text.'
  -
    handle: consent_policy_link
    field:
      type: link
      container: assets
      display: 'Cookie page'
      instructions: 'A page, a file (a PDF) or an address the banner links to for more about cookies.'
