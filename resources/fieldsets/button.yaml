title: Button
fields:
  -
    handle: label
    field:
      type: text
      display: Label
      localizable: true
      width: 66
      antlers: false
  -
    handle: variant
    field:
      type: button_group
      display: Style
      options:
        primary: Primary
        secondary: Secondary
      default: primary
      width: 33
  -
    handle: link_type
    field:
      type: button_group
      display: 'Link to'
      instructions: 'Entry for a page on this site. URL only for another website.'
      ai_instructions: "A page on this website is never a URL: `entry` with the page's Statamic id. `url` only for another website."
      options:
        entry: Entry
        url: URL
        email: Email
        tel: Phone
        asset: Asset
      default: entry
      localizable: true
  -
    handle: entry
    field:
      type: entries
      display: Entry
      max_items: 1
      localizable: true
      validate:
        - 'exclude_unless:{this}.link_type,entry'
        - 'required_with:{this}.label'
      width: 66
      if:
        link_type: 'equals entry'
  -
    handle: query_string
    field:
      type: text
      display: Suffix
      placeholder: '?filter=x or #contact'
      localizable: true
      width: 33
      if:
        link_type: 'equals entry'
  -
    handle: url
    field:
      type: text
      display: URL
      input_type: url
      instructions: "Another website's address, starting with https://."
      localizable: true
      validate:
        - nullable
        - 'regex:~^(https?://|mailto:|tel:|/|#)~i'
      if:
        link_type: 'equals url'
  -
    handle: email
    field:
      type: text
      display: Email
      input_type: email
      localizable: true
      if:
        link_type: 'equals email'
  -
    handle: tel
    field:
      type: text
      display: Phone
      input_type: tel
      localizable: true
      if:
        link_type: 'equals tel'
  -
    handle: asset
    field:
      type: assets
      display: Asset
      container: assets
      max_files: 1
      localizable: true
      if:
        link_type: 'equals asset'
  -
    handle: show_controls
    field:
      type: revealer
      mode: button
      display: 'Advanced options'
      input_label: 'Advanced options'
      hide_display: true
  -
    handle: target_blank
    field:
      type: toggle
      display: 'Open in a new tab'
      width: 100
      if:
        show_controls: 'equals true'
  -
    handle: attr_title
    field:
      type: text
      display: Title
      instructions: 'Shown on hover.'
      width: 50
      if:
        show_controls: 'equals true'
  -
    handle: attr_aria
    field:
      type: text
      display: 'Screen reader label'
      instructions: 'Only when the label does not say where it goes.'
      width: 50
      if:
        show_controls: 'equals true'
